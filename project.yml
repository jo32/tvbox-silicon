name: TVBox
options:
  bundleIdPrefix: com.tvbox
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, ja]
  deploymentTarget:
    macOS: '15.0'
    iOS: '17.0'
    tvOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.8.1'
    CURRENT_PROJECT_VERSION: '39'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Yingxia
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
packages:
  # Symlinks to the root Package.swift, Sources, Vendor and Tests. Xcode walks every file under a
  # local package before building, so pointing it at the repo root made it scan build/ (minutes).
  TVCore:
    path: Packages/TVCore
  # Mac updates (App/MacUpdater.swift). Scripts/make-appcast.sh uses the same version's tools.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # The Mac detail page's aurora backdrop (App/DetailAurora.swift).
  ColorfulX:
    url: https://github.com/Lakr233/ColorfulX
    exactVersion: 6.2.1
targetTemplates:
  SharedApp:
    type: application
    sources:
      - path: App
      # Release notes the website publishes; the bundled copy shows What's New offline.
      - path: website/public/releases.json
        buildPhase: resources
    dependencies:
      - package: TVCore
    info:
      path: Config/Info-${target_name}.plist
      properties:
        CFBundleDisplayName: Yingxia
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to the local media and subscription services you configure, and find Yingxia on your other devices.
        # Play On (Sources/TVCore/PlayOn.swift): iOS browses and advertises only the Bonjour types listed here.
        NSBonjourServices: [_yingxia._tcp]
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
targets:
  TVBox-macOS:
    templates: [SharedApp]
    platform: macOS
    sources:
      - path: App
      - path: Config/macOS/Assets.xcassets
      - path: build/ScriptHost
        type: folder
        buildPhase: resources
      - path: build/PythonHost
        type: folder
        buildPhase: resources
      - path: build/JavaHost
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Check the bundled Java host
        script: '"$SRCROOT/Scripts/check-java-host.sh" "$SRCROOT/build/JavaHost/host.jar" && touch "$DERIVED_FILE_DIR/java-host-checked"'
        # Declared, so the script sandbox lets it read them and it runs again only when one changes.
        inputFiles:
          - $(SRCROOT)/Scripts/check-java-host.sh
          - $(SRCROOT)/Runtime/JavaHost/src/main/java/tvbox/runtime/BytecodeCompatibility.java
          - $(SRCROOT)/build/JavaHost/host.jar
        outputFiles:
          - $(DERIVED_FILE_DIR)/java-host-checked
    dependencies:
      - package: Sparkle
      - package: ColorfulX
    info:
      properties:
        # Sparkle (App/MacUpdater.swift) picks the appcast for the package in code. Every update must be signed
        # with this key (private half: ~/.sparkle/yingxia_ed25519.key on the release Mac), and so must the appcast.
        SUPublicEDKey: GH90e0snzIFHgk1wn+91KyrD6jbOnOu7sC7GJPWdG6c=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jo32.yingxia.mac
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TVBox-iOS:
    templates: [SharedApp]
    platform: iOS
    sources:
      - path: Runtime/AppleRuntime/Native/AppleRuntime.m
      # Python sources: opens the CPython that the embed step below adds (Scripts/build-apple-python.sh).
      - path: Runtime/AppleRuntime/Native/ApplePython.c
      # App icon; its dark and tinted versions are generated by Design/make-ios-icon.swift.
      - path: Config/iOS/Assets.xcassets
      - path: Config/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    postBuildScripts:
      - name: Embed on-device Java runtime
        script: |
          set -eu
          RUNTIME="$SRCROOT/build/AppleRuntime/$PLATFORM_NAME"
          test -f "$RUNTIME/lib/libTVAppleRuntime.a"
          "$SRCROOT/Scripts/check-java-host.sh" "$RUNTIME/Resources/JavaHost/host.jar"
          rsync -a --delete "$RUNTIME/Resources/lib/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/lib/"
          rsync -a --delete "$RUNTIME/Resources/JavaHost/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/JavaHost/"
        basedOnDependencyAnalysis: false
      - name: Embed on-device Python runtime
        script: '"$SRCROOT/Scripts/embed-apple-python.sh"'
        basedOnDependencyAnalysis: false
      - name: Embed on-device Node runtime
        script: '"$SRCROOT/Scripts/embed-node-mobile.sh"'
        basedOnDependencyAnalysis: false
    settings:
      HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/build/AppleRuntime/$(PLATFORM_NAME)/include
      OTHER_LDFLAGS: $(inherited) -Wl,-force_load,$(SRCROOT)/build/AppleRuntime/$(PLATFORM_NAME)/lib/libTVAppleRuntime.a -Wl,-export_dynamic -lc++ -lz -liconv -framework Security -framework CoreGraphics
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      ENABLE_DEBUG_DYLIB: NO
      # An archive (TestFlight) strips every symbol by default, but the embedded JVM looks up its jimage
      # and JNI entry points with dlsym; keep the global ones that -export_dynamic exports.
      STRIP_STYLE: non-global
      ARCHS: arm64
      PRODUCT_BUNDLE_IDENTIFIER: com.jo32.yingxia.ios
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: '1,2'
    info:
      properties:
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Save Code to Photos, where a sign-in code can be scanned by the app on the same phone.
        NSPhotoLibraryAddUsageDescription: Saves a sign-in code to Photos, so the app on this phone can scan it.
        # yingxia://douyin-login, the code an Apple TV shows to receive the Douyin sign-in.
        CFBundleURLTypes:
          - CFBundleURLName: com.tvbox.yingxia.handoff
            CFBundleURLSchemes: [yingxia]
  TVBox-tvOS:
    templates: [SharedApp]
    platform: tvOS
    sources:
      - path: Runtime/AppleRuntime/Native/AppleRuntime.m
      # Python sources: opens the CPython that the embed step below adds (Scripts/build-apple-python.sh).
      - path: Runtime/AppleRuntime/Native/ApplePython.c
      # Layered app icon and top shelf images, generated by Design/make-tvos-icon.swift.
      - path: Config/tvOS/Assets.xcassets
      - path: Config/tvOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    postBuildScripts:
      - name: Embed on-device Java runtime
        script: |
          set -eu
          RUNTIME="$SRCROOT/build/AppleRuntime/$PLATFORM_NAME"
          test -f "$RUNTIME/lib/libTVAppleRuntime.a"
          "$SRCROOT/Scripts/check-java-host.sh" "$RUNTIME/Resources/JavaHost/host.jar"
          rsync -a --delete "$RUNTIME/Resources/lib/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/lib/"
          rsync -a --delete "$RUNTIME/Resources/JavaHost/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/JavaHost/"
        basedOnDependencyAnalysis: false
      - name: Embed on-device Python runtime
        script: '"$SRCROOT/Scripts/embed-apple-python.sh"'
        basedOnDependencyAnalysis: false
    settings:
      HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/build/AppleRuntime/$(PLATFORM_NAME)/include
      OTHER_LDFLAGS: $(inherited) -Wl,-force_load,$(SRCROOT)/build/AppleRuntime/$(PLATFORM_NAME)/lib/libTVAppleRuntime.a -Wl,-export_dynamic -lc++ -lz -liconv -framework Security -framework CoreGraphics
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      ENABLE_DEBUG_DYLIB: NO
      # An archive (TestFlight) strips every symbol by default, but the embedded JVM looks up its jimage
      # and JNI entry points with dlsym; keep the global ones that -export_dynamic exports.
      STRIP_STYLE: non-global
      ARCHS: arm64
      PRODUCT_BUNDLE_IDENTIFIER: com.jo32.yingxia.tv
      ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
    info:
      properties:
        ITSAppUsesNonExemptEncryption: false
